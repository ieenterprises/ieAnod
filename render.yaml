databases:
  - name: nod-db
    databaseName: nod
    user: nod
    plan: free

services:
  - type: web
    name: nod-web
    runtime: docker
    dockerfilePath: ./deployment/render/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOD_ENVIRONMENT
        value: production
      - key: NOD_RELAX_HOST_CHECK
        value: "true"
      - key: NOD_ANALYTICS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nod-db
          property: connectionString
      - key: RENDER_SECRET_SEED
        generateValue: true
